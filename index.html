<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Easy Drug</title>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#006a60">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#060f0e';
            document.body && (document.body.style.backgroundColor = '#060f0e');
          } else {
            document.documentElement.style.backgroundColor = '#f7f9f6';
            document.body && (document.body.style.backgroundColor = '#f7f9f6');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" style="background:#f7f9f6;min-height:100%;"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
