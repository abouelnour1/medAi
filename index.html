<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Easy Drug</title>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#006a60">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
      /* probe div عشان نقيس env(safe-area-inset-top) */
      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: env(safe-area-inset-top, 0px);
        pointer-events: none;
        visibility: hidden;
      }
    </style>
    <script>
      (function() {
        try {
          // ── Theme ──────────────────────────────────────────────
          var t = localStorage.getItem('theme');
          var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#060f0e';
          } else {
            document.documentElement.style.backgroundColor = '#f7f9f6';
          }

          // ── Status Bar Height ──────────────────────────────────
          var isAndroid = /Android/i.test(navigator.userAgent);
          var savedSB = parseInt(localStorage.getItem('_sb') || '0', 10);
          var savedHH = parseInt(localStorage.getItem('_hh') || '0', 10);

          // القيمة اللي هنستخدمها
          var statusH;

          if (savedSB >= 20 && savedSB <= 120) {
            // عندنا قيمة محفوظة من جلسة سابقة → استخدمها فوراً
            statusH = savedSB;
          } else if (isAndroid) {
            // أول مرة على Android → نقيس env(safe-area-inset-top) بـ probe div
            // بنعمل ده sync قبل أي render
            var probe = document.createElement('div');
            probe.id = 'safe-area-probe';
            probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden;';
            document.documentElement.appendChild(probe);
            var probeH = probe.getBoundingClientRect().height;
            document.documentElement.removeChild(probe);
            
            // لو env() شتغلت وديت قيمة حقيقية
            statusH = (probeH >= 20 && probeH <= 120) ? Math.round(probeH) : 30;
          } else {
            statusH = 0;
          }

          // طبق CSS variables
          document.documentElement.style.setProperty('--android-status', statusH + 'px');

          // حساب header height
          var headerH = (savedHH >= 40 && savedHH <= 200) ? savedHH : (statusH + 8 + 56 + 3);
          document.documentElement.style.setProperty('--header-h', headerH + 'px');

          // احفظ الـ status bar height لو مش محفوظ
          if (!(savedSB >= 20 && savedSB <= 120) && statusH >= 20) {
            try { localStorage.setItem('_sb', String(statusH)); } catch(e) {}
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" style="background:#f7f9f6;min-height:100%;"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
