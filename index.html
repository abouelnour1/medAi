    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PharmaSource KSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <meta name="theme-color" content="#14b8a6">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-status-bar" content="#14b8a6">

    <style>
      :root {
        --primary-color: #14b8a6;
      }
      html {
        height: 100%;
        width: 100%;
        overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      html[lang="ar"] body {
        font-family: 'Cairo', sans-serif;
      }
      html[lang="en"] body {
        font-family: 'Poppins', sans-serif;
      }
      
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        -webkit-font-smoothing: antialiased;
        background-color: #f8fafc;
        color: #0f172a;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }
      
      input, textarea, [contenteditable="true"] {
        cursor: text !important;
        user-select: text !important;
        -webkit-user-select: text !important;
      }

      button, a, [role="button"], select {
        cursor: pointer !important;
      }

      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: absolute;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
