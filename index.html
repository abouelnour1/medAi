<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Easy Drug</title>

    <!-- خطوط محلية - لا تحتاج إنترنت -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d9488">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Dark Mode Flash Prevention - يجب أن يكون أول شيء -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#020617';
          } else {
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      /* ── الحجم الثابت بغض النظر عن إعدادات الموبايل ── */
      :root {
        font-size: 14px !important;
        -webkit-text-size-adjust: 100% !important;
        -moz-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
      }
      /* iOS design tokens - light mode */
      :root {
        --ios-bg: #f7f9f6;
        --ios-bg2: #ffffff;
        --ios-bg3: #f7f9f6;
        --ios-label: #0e1a18;
        --ios-label2: rgba(14, 26, 24, 0.6);
        --ios-label3: rgba(14, 26, 24, 0.3);
        --ios-sep: rgba(14, 26, 24, 0.29);
        --ios-sepCell: rgba(14, 26, 24, 0.12);
        --ios-fill: rgba(14, 26, 24, 0.08);
      }
      /* iOS design tokens - dark mode */
      html.dark {
        --ios-bg: #000000;
        --ios-bg2: #1c1c1e;
        --ios-bg3: #2c2c2e;
        --ios-label: #ffffff;
        --ios-label2: rgba(235, 235, 245, 0.6);
        --ios-label3: rgba(235, 235, 245, 0.3);
        --ios-sep: rgba(84, 84, 88, 0.6);
        --ios-sepCell: rgba(84, 84, 88, 0.35);
        --ios-fill: rgba(118, 118, 128, 0.24);
      }
      /* منع الوميض */
      html { background-color: #f7f9f6; }
      html.dark { background-color: #000000; }
      body {
        font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', 'Cairo', sans-serif;
        background-color: #f7f9f6;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        color: #0e1a18;
        /* منع تغيير الخط بإعدادات المستخدم */
        -webkit-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
      }
      .dark body {
        background-color: #020617;
        color: #f8fafc;
      }
      #root { 
        height: 100%;
        display: flex; 
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }
      html { 
        height: 100%;
        overscroll-behavior: none;
      }
      body { 
        height: 100%;
        overflow: hidden;
        width: 100%;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        /* Android keyboard fix — لا نستخدم dvh عشان بيتغير مع الكيبورد */
      }
      ::-webkit-scrollbar { width: 0px; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .bg-glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .dark .bg-glass {
        background: rgba(15, 23, 42, 0.7);
        border-color: rgba(255, 255, 255, 0.05);
      }

      /* الحجم ثابت على كل الشاشات — مش بيتغير بحجم الموبايل */
      @media (min-width: 390px)  { :root { font-size: 14px !important; } }
      @media (min-width: 768px)  { :root { font-size: 15px !important; } }
      @media (min-width: 1024px) { :root { font-size: 16px !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
