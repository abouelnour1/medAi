<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Easy Drug</title>

    <!-- خطوط محلية - لا تحتاج إنترنت -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d9488">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Dark Mode Flash Prevention - يجب أن يكون أول شيء -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#020617';
          } else {
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      /* ── الحجم الثابت بغض النظر عن إعدادات الموبايل ── */
      :root {
        font-size: 14px !important;
        -webkit-text-size-adjust: 100% !important;
        -moz-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
      }
      /* iOS design tokens - light mode */
      :root {
        --ios-bg: #f7f9f6;
        --ios-bg2: #ffffff;
        --ios-bg3: #f7f9f6;
        --ios-label: #0e1a18;
        --ios-label2: rgba(14, 26, 24, 0.6);
        --ios-label3: rgba(14, 26, 24, 0.3);
        --ios-sep: rgba(14, 26, 24, 0.29);
        --ios-sepCell: rgba(14, 26, 24, 0.12);
        --ios-fill: rgba(14, 26, 24, 0.08);
        --ios-tabbar-bg: rgba(249,249,249,0.94);
      }
      /* iOS design tokens - dark mode */
      html.dark {
        --ios-bg: #000000;
        --ios-bg2: #1c1c1e;
        --ios-bg3: #2c2c2e;
        --ios-label: #ffffff;
        --ios-label2: rgba(235, 235, 245, 0.6);
        --ios-label3: rgba(235, 235, 245, 0.3);
        --ios-sep: rgba(84, 84, 88, 0.6);
        --ios-sepCell: rgba(84, 84, 88, 0.35);
        --ios-fill: rgba(118, 118, 128, 0.24);
        --ios-tabbar-bg: rgba(28,28,30,0.94);
      }
      /* منع الوميض */
      html { background-color: #f7f9f6; }
      html.dark { background-color: #000000; }
      @keyframes iosFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      body {
        font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', 'Cairo', sans-serif;
        background-color: #f7f9f6;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        color: #0e1a18;
        /* منع تغيير الخط بإعدادات المستخدم */
        -webkit-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
      }
      .dark body {
        background-color: #020617;
        color: #f8fafc;
      }
      #root { 
        height: 100%;
        display: flex; 
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }
      html { 
        height: 100%;
        overscroll-behavior: none;
      }
      body { 
        height: 100%;
        overflow: hidden;
        width: 100%;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        /* Android keyboard fix — لا نستخدم dvh عشان بيتغير مع الكيبورد */
      }
      ::-webkit-scrollbar { width: 0px; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .bg-glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .dark .bg-glass {
        background: rgba(15, 23, 42, 0.7);
        border-color: rgba(255, 255, 255, 0.05);
      }

      /* ═══ iOS style overrides for modals (DrugTest, Pediatric, Prescription, OrderList) ═══ */
      /* Make modals match iOS design tokens */
      .bg-white, [class*="bg-white"]:not([class*="bg-white/"]) {
        background-color: var(--ios-bg2) !important;
      }
      .dark .dark\\:bg-dark-card, .dark .dark\\:bg-dark-bg {
        background-color: var(--ios-bg2) !important;
      }
      .dark .dark\\:bg-slate-800, .dark .dark\\:bg-slate-900, .dark .dark\\:bg-slate-700 {
        background-color: var(--ios-bg2) !important;
      }
      /* Text colors in dark mode - force readable text everywhere */
      .dark .dark\\:text-white, .dark .dark\\:text-dark-text {
        color: var(--ios-label) !important;
      }
      .dark .dark\\:text-slate-300, .dark .dark\\:text-slate-400 {
        color: var(--ios-label2) !important;
      }
      /* Badges with white/light bg + dark text - fix in dark mode */
      .dark .bg-white.text-slate-700, .dark .bg-white.text-slate-800,
      .dark .bg-slate-100.text-slate-700, .dark .bg-slate-100.text-slate-800 {
        background-color: rgba(120, 120, 128, 0.24) !important;
        color: var(--ios-label) !important;
      }
      /* Generic: any text-slate-700/800/900 in dark, make readable */
      .dark .text-slate-700, .dark .text-slate-800, .dark .text-slate-900 {
        color: var(--ios-label) !important;
      }
      /* Borders */
      .dark .dark\\:border-dark-border, .dark .dark\\:border-slate-700, .dark .dark\\:border-slate-800 {
        border-color: var(--ios-sepCell) !important;
      }
      .dark .border-slate-100, .dark .border-slate-200, .dark .border-slate-300 {
        border-color: var(--ios-sepCell) !important;
      }
      /* Light backgrounds in dark mode */
      .dark .bg-light-bg, .dark .bg-slate-50, .dark .bg-slate-100 {
        background-color: var(--ios-bg) !important;
      }
      /* Inputs in dark mode */
      .dark input, .dark textarea, .dark select {
        color: var(--ios-label) !important;
        background-color: var(--ios-bg2) !important;
      }
      .dark input::placeholder, .dark textarea::placeholder {
        color: var(--ios-label2) !important;
      }
      /* Make primary teal in light AND dark match brand */
      .text-primary, .text-teal-500, .text-teal-600, .text-teal-700 {
        color: #006a60 !important;
      }
      .dark .text-primary, .dark .text-teal-300, .dark .text-teal-400, .dark .text-teal-500 {
        color: #00a896 !important;
      }
      .bg-primary { background-color: #006a60 !important; }
      .dark .bg-primary { background-color: #00a896 !important; }
      /* Remove sharp shadows on dark mode cards */
      .dark .shadow, .dark .shadow-sm, .dark .shadow-md, .dark .shadow-lg, .dark .shadow-xl {
        box-shadow: 0 0 0 0.5px var(--ios-sepCell) !important;
      }

      /* iOS-style Insurance search input */
      .insurance-search-wrap input[type="text"],
      .insurance-search-wrap input[type="search"] {
        border-radius: 10px !important;
        background-color: var(--ios-fill) !important;
        border: none !important;
        padding: 10px 14px !important;
        font-size: 17px !important;
        color: var(--ios-label) !important;
        outline: none !important;
        box-shadow: none !important;
      }
      .insurance-search-wrap input::placeholder {
        color: var(--ios-label2) !important;
      }

      /* الحجم ثابت على كل الشاشات — مش بيتغير بحجم الموبايل */
      @media (min-width: 390px)  { :root { font-size: 14px !important; } }
      @media (min-width: 768px)  { :root { font-size: 15px !important; } }
      @media (min-width: 1024px) { :root { font-size: 16px !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
