    <title>PharmaSource KSA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#14b8a6',
                dark: '#0f766e',
                light: '#99f6e4',
              },
              secondary: '#0ea5e9',
              accent: '#f59e0b',
              'light-bg': '#f8fafc',
              'dark-bg': '#020617',
              'dark-card': '#0f172a',
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'slide-up': 'slideUp 0.4s ease-out forwards',
              'bounce-subtle': 'bounceSubtle 2s infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              bounceSubtle: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-5px)' } }
            }
          }
        }
      }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f766e">
    <style>
      :root { font-size: 14px; }
      body {
        font-family: 'Cairo', 'Poppins', sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .dark body { background-color: #020617; }
      #root { height: 100vh; display: flex; flex-direction: column; }
      ::-webkit-scrollbar { width: 0px; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .bg-glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dark .bg-glass {
        background: rgba(2, 6, 23, 0.85);
      }

      @media (min-width: 640px) { :root { font-size: 16px; } }
    </style>
