<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PharmaSource KSA</title>

    <!-- خطوط محلية - لا تحتاج إنترنت -->
    <link rel="stylesheet" href="/fonts/fonts.css">

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d9488">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Dark Mode Flash Prevention - يجب أن يكون أول شيء -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#020617';
          } else {
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      :root { font-size: 14px; }
      /* منع الوميض - تأكيد الألوان الأساسية */
      html { background-color: #f8fafc; }
      html.dark { background-color: #020617; }
      body {
        font-family: 'Cairo', 'Poppins', sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        color: #0f172a;
      }
      .dark body {
        background-color: #020617;
        color: #f8fafc;
      }
      #root { height: 100vh; display: flex; flex-direction: column; }
      ::-webkit-scrollbar { width: 0px; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .bg-glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .dark .bg-glass {
        background: rgba(15, 23, 42, 0.7);
        border-color: rgba(255, 255, 255, 0.05);
      }

      @media (min-width: 640px) { :root { font-size: 16px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
