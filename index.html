
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PharmaSource KSA</title>
    
    <!-- Tailwind Runtime -->
<link rel="stylesheet" href="./pharmasource_tailwind.css">    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#14b8a6">
    <link rel="icon" type="image/png" href="./logo.png">
    <meta name="apple-mobile-web-app-status-bar" content="#14b8a6">

    <style>
      :root {
        --primary: #14b8a6;
        --primary-dark: #0f766e;
        --bg-light: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-sec: #64748b;
      }

      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--bg-light);
        color: var(--text-main);
        font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        background: linear-gradient(to bottom, #2dd4bf, #0f766e);
        min-height: 60px;
        padding-top: env(safe-area-inset-top);
        color: white;
        z-index: 50;
      }

      nav {
        padding-bottom: env(safe-area-inset-bottom);
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@0.15.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
    "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js",
    "@capacitor/app": "https://esm.sh/@capacitor/app@6.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.9.0/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "@capacitor/cli": "https://esm.sh/@capacitor/cli@^8.1.0"
  }
}
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
        <div style="display:flex; height:100vh; width:100vw; align-items:center; justify-content:center; flex-direction:column; gap:1rem; background:#f8fafc;">
             <div style="width:40px; height:40px; border:4px solid #14b8a622; border-top-color:#14b8a6; border-radius:50%; animation: spin 1s linear infinite;"></div>
             <p style="font-family: Cairo, sans-serif; font-weight:bold; color:#14b8a6;">PharmaSource KSA</p>
        </div>
    </div>
    <script type="module" src="./index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // استخدام مسار نسبي لتجنب Origin Mismatch
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.warn('Service Worker registration failed:', err);
          });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
